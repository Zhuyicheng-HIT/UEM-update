DATA:
  DATASET_NAME: ee4d
  REPRE_TYPE: v4_beta
  COND_BETAS: False
  COND_IMG_FEAT: True
  COND_TRAJ: True
  WINDOW: 80
  IMG_FEAT_TYPE: dinov2
  BATCH_SIZE: 64  # per GPU; 8 GPUs => global batch 512
  NUM_WORKERS: 8  # per GPU
  PIN_MEMORY: True
  PERSISTENT_WORKERS: True
  PREFETCH_FACTOR: 2
  DROP_LAST: True

SPARSE_JOINTS:
  ENABLED: True
  # pelvis, knees, ankles, feet, head, elbows, and wrists in SMPL22 order
  INDICES: [0, 4, 5, 7, 8, 10, 11, 15, 18, 19, 20, 21]

MODEL:
  MODEL_NAME: uem
  GENERATIVE_TYPE: flow

FLOW:
  NUM_STEPS: 10
  SOLVER: euler
  BETA_ALPHA: 1.5
  BETA_BETA: 1.0
  T_MIN: 0.001
  PREDICTION_TYPE: velocity
  GLOBAL_WEIGHT: 1.0
  # Derived from 9 * len(SPARSE_JOINTS.INDICES); get_cfg updates these
  # automatically when the joint set is overridden from the command line.
  GLOBAL_FEATURE_START: 108
  GLOBAL_FEATURE_END: 117

TRAIN:
  EXP_PATH: exp/uem_flow_8gpu_e300
  USE_CKPT_LR: True
  WEIGHT_DECAY: 0.01
  LR: 8.5e-5
  NUM_EPOCHS: 300
  NUM_GPUS: 8
  PRECISION: bf16-mixed
  ACCUMULATE_GRAD_BATCHES: 1
  GRADIENT_CLIP_VAL: 1.0
  DDP_STATIC_GRAPH: True
  CUDNN_BENCHMARK: True
  FUSED_ADAMW: False  # required for EMA + bf16-mixed + gradient clipping on Lightning 2.4
  EMA_DECAY: 0.992028
  SCHEDULER: cosine_warmup
  WARMUP_EPOCHS: 5
  SCHEDULER_TOTAL_EPOCHS: 300
  MIN_LR_RATIO: 0.1
  NUM_SANITY_VAL_STEPS: 0
  LOG_EVERY_N_STEPS: 10
  PROGRESS_REFRESH_RATE: 10
  CHECK_VAL_EVERY_N_EPOCHS: 5
  SAVE_EVERY_N_EPOCHS: 10
  EARLY_STOP_PATIENCE: 0
  EARLY_STOP_MIN_DELTA: 1.0e-4

EVAL:
  KEY_JOINTS_ONLY: True
  KEY_JOINT_INDICES: [0, 4, 5, 7, 8, 10, 11, 15, 18, 19, 20, 21]
  RUN_SEMANTIC: False
  NUM_GPUS: 8
  NUM_SAMPLES: 256
  BATCH_SIZE: 64
